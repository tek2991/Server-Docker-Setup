services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Mount application directory read-only for fast, direct static asset serving
      - ../dwelly/src:/srv/dwelly:ro
      # Uncomment as other apps are cloned and deployed:
      # - ../site-b/src:/srv/site-b:ro
      # - ../site-c/src:/srv/site-c:ro
      # - ../site-d/src:/srv/site-d:ro
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.2"

networks:
  web:
    external: true

volumes:
  caddy_data:
  caddy_config:
